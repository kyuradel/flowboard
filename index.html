<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>플로우보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <div class="brand">
      <span class="brand-mark"><i></i><i></i><i></i></span>
      <span class="brand-name">플로우보드</span>
    </div>
    <span class="nav-sep">|</span>
    <span class="nav-ws">내 작업공간</span>
    <div class="nav-right">
      <span class="chip">개인 보드</span>
      <button class="icon-btn" type="button" aria-label="더보기">⋯</button>
    </div>
  </div>
</nav>

<div class="app">
  <header class="top">
    <div class="titles">
      <p class="eyebrow">작은 계획이, 완성되는 곳</p>
      <h1>나의 할 일 보드</h1>
      <p class="sub">오늘 할 일을 세 칸으로 정리해요</p>
    </div>
    <button class="btn primary new-task-btn" id="newTaskBtn" type="button">
      <span class="plus">+</span> 새 할일 <kbd>N</kbd>
    </button>
  </header>

  <div class="stats-row">
    <div class="filter-tabs" id="filterTabs">
      <button class="tab active" data-filter="all" type="button">전체 <span class="tab-count" id="countAll">0</span></button>
      <button class="tab" data-filter="overdue" type="button">⚠ 마감 지남 <span class="tab-count" id="countOverdue">0</span></button>
    </div>
    <div class="progress-wrap">
      <span id="progressLabel">완료 0/0</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
  </div>

  <div class="board" id="board"></div>

  <footer class="hint-row">
    <span id="hintLeft">💡 카드를 드래그해 상태를 바꿔보세요</span>
    <span>작은 한 걸음이 쌓이면, 어느새 Done.</span>
  </footer>
</div>

<div class="overlay" id="overlay" hidden>
  <form class="modal" id="cardForm">
    <h2 id="modalTitle">카드 추가</h2>
    <div class="field">
      <label for="fTitle">제목</label>
      <input id="fTitle" type="text" maxlength="60" placeholder="예: 디자인 시안 그리기" required>
    </div>
    <div class="field">
      <label for="fDesc">설명</label>
      <textarea id="fDesc" rows="3" maxlength="300" placeholder="세부 내용을 적어주세요 (선택)"></textarea>
    </div>
    <div class="field">
      <label for="fDue">마감일</label>
      <input id="fDue" type="date">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn danger" id="deleteBtn" hidden>삭제</button>
      <div class="right-actions">
        <button type="button" class="btn ghost" id="cancelBtn">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </div>
  </form>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
